[project]
name = "splitsnap"
version = "0.1.0"
description = "Snap a receipt, split the bill."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "boto3>=1.43.95",
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-ratelimit>=4.1.0",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "pydantic>=2.13.5",
    "python-json-logger>=4.2.0",
    "sentry-sdk>=2.69.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "hypothesis>=6.0",
    "coverage>=7.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = ["_docs", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-markers -q"

[tool.coverage.run]
source = ["splitting", "receipts", "bills", "core"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
