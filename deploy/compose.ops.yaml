# Shared ops stack for the self-hosted dev and prod environments:
# Grafana + OpenTelemetry Collector + Tempo + Loki + Prometheus, plus SplitSnap dashboards
# and alert rules provisioned from observability/. Started by deploy/deploy.sh.
#   docker compose -p splitsnap-ops -f deploy/compose.ops.yaml up -d
# Grafana: http://localhost:3030 (OPS_GRAFANA_PORT). Apps export OTLP to http://lgtm:4318.
services:
  lgtm:
    image: grafana/otel-lgtm:0.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPS_GRAFANA_PORT:-3030}:3000"
    environment:
      # Where the alert webhook contact point delivers (ops/alert_relay.py on the host).
      ALERT_RELAY_URL: ${ALERT_RELAY_URL:-http://host.docker.internal:9095/alert}
      ALERT_RELAY_TOKEN: ${ALERT_RELAY_TOKEN:?set by deploy.sh from ~/.splitsnap/relay.token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lgtm:/data
      - ../observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/splitsnap.yaml:ro
      - ../observability/grafana/dashboards:/otel-lgtm/splitsnap-dashboards:ro
      - ../observability/grafana/alerting/splitsnap-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/splitsnap-alerts.yaml:ro
    networks:
      ops:
        aliases: [lgtm]

volumes:
  lgtm:

networks:
  ops:
    name: splitsnap-ops
    external: true
