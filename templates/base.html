<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SplitSnap{% endblock %}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" integrity="sha512-2kIcAizYXhIn2TBI4r8xQv6tprlkH2gfMFMXpc/mCBCmGjv/DmSBGEVKMOc6YLDNwE+XILEHM1yY/xmOOFIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        :root { --bg: #fff; --fg: #111; --muted: #666; --border: #ddd; --accent: #2563eb; --danger: #dc2626; --success: #16a34a; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #111; --fg: #eee; --muted: #999; --border: #333; --accent: #60a5fa; --danger: #f87171; --success: #4ade80; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 48rem; margin: 0 auto; padding: 1rem; }
        h1, h2, h3 { margin-bottom: 0.5rem; }
        a { color: var(--accent); }
        form { margin-bottom: 1rem; }
        input, select, button, textarea { font: inherit; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); }
        button { cursor: pointer; background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 0.5rem 1rem; }
        button.danger { background: var(--danger); }
        button.secondary { background: var(--muted); }
        .gap-banner { padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; }
        .gap-banner.zero { background: #d1fae5; color: #065f46; }
        .gap-banner.nonzero { background: #fee2e2; color: #991b1b; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid var(--border); }
        .section { margin-bottom: 2rem; }
        .check { color: var(--success); } .cross { color: var(--danger); }
        .htmx-indicator { display: none; } .htmx-request .htmx-indicator { display: inline; }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block content %}{% endblock %}
</body>
</html>
