{% extends "base.html" %}
{% block title %}Upload Receipt — SplitSnap{% endblock %}
{% block content %}
<h1>SplitSnap</h1>
<p>Upload a receipt to split the bill.</p>

{% if error %}<p style="color: var(--danger);">{{ error }}</p>{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="receipt" accept="image/jpeg,image/png,image/webp,image/heic">
    <button type="submit">Upload</button>
    <span class="htmx-indicator">Processing...</span>
</form>
{% endblock %}
