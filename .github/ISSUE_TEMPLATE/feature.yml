name: Feature
description: New capability or improvement
labels: ["type:feature", "agent:planner"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence of user-visible value.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Observable, testable statements. Use CONTEXT.md terms.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
