name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: splitsnap_test
          POSTGRES_USER: splitsnap
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U splitsnap"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://splitsnap:test@localhost:5432/splitsnap_test
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11"
      - run: uv sync --group dev
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py check
      - name: Deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-dummy-key
          ALLOWED_HOSTS: localhost
          DATABASE_URL: postgres://splitsnap:test@localhost:5432/splitsnap_test
        run: uv run python manage.py check --deploy
      - name: Unit tests
        run: uv run coverage run -m pytest -m unit
      - name: Integration tests (Postgres)
        run: uv run coverage run -a -m pytest -m integration
      - run: uv run coverage report

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: End-to-end journey probe against the container
        run: docker compose exec -T web python manage.py probe_journey --base-url http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
